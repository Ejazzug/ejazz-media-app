workflows:
  ejazz-android-release:
    name: EJazz Media - Android Release (AAB + APK)
    max_build_duration: 90
    environment:
      node: 20
      java: 17
      groups:
        - ejazz_eas
      vars:
        # Baked into the bundle at build time (EXPO_PUBLIC_* is inlined by Expo, so it is
        # NOT a secret and must never hold one). Without it the app silently disables every
        # Pulse feature -- isPulseConfigured() returns false and no request is ever made --
        # which is why Home showed no Pulse cards and the Control Room reached nobody.
        EXPO_PUBLIC_PULSE_API_URL: "https://control.ejazzug.com"
        # EJazz Xtra moved from RadioBoss to AzuraCast. Set here, in version control, rather
        # than only in the ejazz_eas variable group, which is not visible from the server and
        # still carries the old c32.radioboss.fm:8320 address. Delete it from that group too:
        # if the group wins the merge, a build would silently bake the dead stream back in.
        EXPO_PUBLIC_EJAZZ_EXTRA_STREAM_URL: "https://stream.ejazzug.com/listen/ejazzxtra/radio.mp3"
    cache:
      cache_paths:
        - ~/.pnpm-store
    scripts:
      - name: Enable pnpm (matches project's pinned version)
        script: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install workspace dependencies
        script: |
          pnpm install --frozen-lockfile
      - name: Install eas-cli
        script: npm install -g eas-cli
      - name: Build signed AAB with eas build --local
        script: |
          cd artifacts/ejazz-media-app
          eas build --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output app-release.aab
      - name: Build matching signed APK with eas build --local
        script: |
          cd artifacts/ejazz-media-app
          eas build --local \
            --platform android \
            --profile production-apk \
            --non-interactive \
            --output app-release.apk
    artifacts:
      - artifacts/ejazz-media-app/app-release.aab
      - artifacts/ejazz-media-app/app-release.apk
    publishing:
      email:
        recipients:
          - madvibes.ug@gmail.com

  ejazz-android-preview:
    name: EJazz Media - Android Preview (Internal AAB + APK)
    max_build_duration: 90
    environment:
      node: 20
      java: 17
      groups:
        - ejazz_eas
      vars:
        # Same as the release workflow -- a preview build that cannot reach Pulse, or that
        # plays the old stream, would not be testing the same app. See the notes there.
        EXPO_PUBLIC_PULSE_API_URL: "https://control.ejazzug.com"
        EXPO_PUBLIC_EJAZZ_EXTRA_STREAM_URL: "https://stream.ejazzug.com/listen/ejazzxtra/radio.mp3"
    cache:
      cache_paths:
        - ~/.pnpm-store
    scripts:
      - name: Enable pnpm (matches project's pinned version)
        script: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install workspace dependencies
        script: |
          pnpm install --frozen-lockfile
      - name: Install eas-cli
        script: npm install -g eas-cli
      - name: Build preview AAB for manual Play internal testing
        script: |
          cd artifacts/ejazz-media-app
          eas build --local \
            --platform android \
            --profile preview-aab \
            --non-interactive \
            --output app-preview.aab
      - name: Build preview APK for device testing
        script: |
          cd artifacts/ejazz-media-app
          eas build --local \
            --platform android \
            --profile preview \
            --non-interactive \
            --output app-preview.apk
    artifacts:
      - artifacts/ejazz-media-app/app-preview.aab
      - artifacts/ejazz-media-app/app-preview.apk

  # ---------------------------------------------------------------------------
  # OTA (EAS Update) publishing. These two workflows ship JavaScript and asset
  # changes to an already-installed app. They build NOTHING and upload nothing to
  # Google Play -- if a change touches the native side (a new native module, an
  # SDK bump, permissions, the icon, app.json's native keys) it needs
  # ejazz-android-release instead, and these workflows will tell you so by
  # failing the fingerprint check rather than publishing an update no installed
  # binary can accept.
  #
  # SINGLE-OWNER MODEL. There is one human release operator. Neither workflow
  # declares `triggering:`, so Codemagic will not start either one on a push, a
  # tag, a pull request or a schedule -- they run only when that person starts
  # them, from the UI or the REST API. Production additionally requires a typed
  # confirmation carrying the commit SHA (tools/ota/confirm-production.sh), so
  # even a `triggering:` block added here by mistake could not publish: an
  # automatic run has no way to produce that value.
  #
  # The guards live in tools/ota/, at the repo root, and are shared by both
  # workflows. That location is deliberate. `eas.json` and the app's
  # package.json `scripts` object are both NATIVE FINGERPRINT INPUTS, so putting
  # release tooling in either would change the runtime version of every bundle
  # built afterwards and silently de-synchronise OTA from every installed app.
  # codemagic.yaml and tools/ota/ are outside the fingerprint entirely.
  #
  # As of 2026-11-12 the `production` channel on expo.dev is UNPROTECTED and
  # both the operator and the codemagic-ci robot hold the Developer role, so
  # nothing server-side would stop a publish reaching every user. See
  # docs/OTA-DEPLOYMENT.md section 9 for the one-time Expo Admin/Owner steps
  # that fix that, and why the role grant must come BEFORE the protection.
  # ---------------------------------------------------------------------------

  ejazz-ota-preview:
    name: EJazz Media - OTA Update (preview branch)
    max_build_duration: 30
    environment:
      node: 20
      groups:
        - ejazz_eas          # must provide EAS_ACCESS_TOKEN (see docs/OTA-DEPLOYMENT.md)
      vars:
        EAS_UPDATE_BRANCH: "preview"
        # Required from Expo SDK 55 onward: `eas update` refuses to run without
        # it. It selects the server-side EAS environment whose variables are
        # baked into the published bundle, so it must match the environment the
        # installed binaries were built with. The preview build profile declares
        # `environment: "preview"`, and build 21 was made that way, so this is
        # "preview". It said "production" until 2026-11-12, which would have
        # shipped production configuration to test phones the moment one value
        # diverged; tools/ota/check-env-vars.sh now asserts the pairing so the
        # two cannot drift apart again.
        EAS_UPDATE_ENVIRONMENT: "preview"
        # The hash read out of the binary that is actually installed:
        #     unzip -p app-preview.apk assets/fingerprint
        # Set this when the installed APK came from `eas build --local`, which is
        # never registered on EAS and so cannot be compared against. Leaving it
        # empty is normal; it does NOT disable the check, it only changes which
        # reference the check uses. (It replaces the old
        # OTA_ALLOW_RUNTIME_MISMATCH, which switched the guard off entirely.)
        OTA_EXPECTED_FINGERPRINT: ""
    cache:
      cache_paths:
        - ~/.pnpm-store
    scripts:
      - name: Authenticate (fails before anything else if the token is absent)
        script: |
          set -euo pipefail
          if [ -z "${EAS_ACCESS_TOKEN:-}" ]; then
            echo "EAS_ACCESS_TOKEN is not set. Add it to the ejazz_eas variable"
            echo "group in Codemagic, marked Secure. Nothing was published."
            exit 1
          fi
          # eas-cli reads EXPO_TOKEN, not EAS_ACCESS_TOKEN. Mapping it here keeps
          # the secret in one Codemagic variable while giving the CLI the name it
          # expects. Never echoed: `set -x` is deliberately not used in this
          # workflow, because it would print the token.
          echo "EXPO_TOKEN=$EAS_ACCESS_TOKEN" >> $CM_ENV
      - name: Refuse to run as anything but a deliberate preview publish
        script: |
          set -euo pipefail
          # The production workflow has always had this guard; preview did not,
          # and asymmetric guards are how one of the pair ends up wrong. Preview
          # reaches only internal test installs, so this is cheap insurance
          # rather than a load-bearing control.
          if [ -n "${CM_PULL_REQUEST:-}" ] && [ "${CM_PULL_REQUEST}" != "false" ]; then
            echo "This is a pull-request build. Preview OTA is manual only."
            echo "Nothing was published."
            exit 1
          fi
          echo "Manual preview publish, commit $(git rev-parse HEAD)"
      - name: Enable pnpm (matches project's pinned version)
        script: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install workspace dependencies
        script: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Install eas-cli
        script: |
          set -euo pipefail
          # Pinned. An OTA publish decides what runs on phones already in
          # people's hands, so the tool that computes the bundle and its
          # fingerprint is not left to float to whatever major shipped today.
          npm install -g eas-cli@27.7.2
          eas --version
      - name: Check the working tree and the OTA configuration
        script: |
          set -euo pipefail
          cd artifacts/ejazz-media-app

          # 1. A clean tree. Codemagic clones fresh, so anything modified here was
          #    produced by the install step and would be published silently.
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree is not clean. Refusing to publish an update"
            echo "whose contents do not match a commit:"
            git status --porcelain
            exit 1
          fi
          echo "Publishing from commit: $(git rev-parse HEAD)"

          # 2. The OTA configuration this workflow depends on. Each of these was
          #    null before 2026-11-11, and a publish with any of them missing
          #    either fails obscurely or lands somewhere nobody is listening.
          node -e '
            const c = require("./app.config.base.json");
            const e = c.expo || c;
            const eas = require("./eas.json");
            const fail = (m) => { console.error("CONFIG: " + m); process.exit(1); };
            if (!e.updates || !e.updates.url) fail("expo.updates.url is not set");
            if (!e.updates.enabled) fail("expo.updates.enabled is not true");
            if (!e.runtimeVersion || e.runtimeVersion.policy !== "fingerprint")
              fail("runtimeVersion.policy must be \"fingerprint\"");
            if (!((e.extra||{}).eas||{}).projectId) fail("extra.eas.projectId is not set");
            const want = process.env.EAS_UPDATE_BRANCH;
            const chans = Object.values(eas.build || {}).map(p => p.channel);
            if (!chans.includes(want))
              fail("no build profile in eas.json uses the channel \"" + want + "\", so no installed app would receive this update");
            console.log("Config OK: url=" + e.updates.url + " policy=fingerprint channel=" + want);
          '

          # 3. expo-updates has to actually be installed, or the bundle is built
          #    for a runtime the app does not contain.
          node -e '
            const v = require("expo-updates/package.json").version;
            console.log("expo-updates " + v);
            if (!v.startsWith("57.")) {
              console.error("expo-updates " + v + " is not on the SDK 57 line. `pnpm add` resolves Expo packages to the wrong SDK; pin the 57 line.");
              process.exit(1);
            }
          '
      - name: Check the target environment carries every required variable
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          # Asserts the branch/environment pairing and that every
          # EXPO_PUBLIC_* in tools/ota/required-public-vars.txt resolves to a
          # non-empty value in that environment. Values are never printed.
          # This is the only guard that catches a configuration gap: environment
          # variables are not fingerprint inputs, so a bundle missing one passes
          # every other check here and breaks the feature for every user.
          bash tools/ota/check-env-vars.sh "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT"
      - name: Verify the runtime matches an installed build
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          # Compares this commit's native fingerprint against the newest build
          # registered on the TARGET CHANNEL, or against OTA_EXPECTED_FINGERPRINT
          # when the installed binary was built locally. Exports
          # CURRENT_FINGERPRINT for the publish step to assert on.
          bash tools/ota/check-fingerprint.sh "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT"
      - name: Publish the update and verify it landed
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          MSG="${EAS_UPDATE_MESSAGE:-preview $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)}"
          # Publishes, then reports the group ID, update ID, runtime version,
          # platform, branch and commit, and confirms from the server that the
          # group it named is at the head of the branch. The old version printed
          # `update:list` and left the reading to the operator, which is how the
          # same test update came to be published twice on 2026-11-12 without
          # anyone noticing.
          bash tools/ota/verify-publication.sh \
            "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT" "$MSG"
    publishing:
      email:
        recipients:
          - madvibes.ug@gmail.com

  ejazz-ota-production:
    name: EJazz Media - OTA Update (production branch, MANUAL ONLY)
    max_build_duration: 30
    # No `triggering:` block, as above: this cannot start from a git push. It is
    # the workflow that reaches real listeners, so starting it is always a
    # deliberate act by a person -- and tools/ota/confirm-production.sh requires
    # that person to type this commit's short SHA, which an automatic run has no
    # way to produce.
    environment:
      node: 20
      groups:
        - ejazz_eas
      vars:
        EAS_UPDATE_BRANCH: "production"
        EAS_UPDATE_ENVIRONMENT: "production"
        # Must be set, at start time, to the short SHA of the commit being
        # published (`git rev-parse --short HEAD`). Deliberately left EMPTY in
        # version control: a confirmation stored here would authorise every
        # future run, which is the opposite of a confirmation. See
        # tools/ota/confirm-production.sh for why a SHA and not a fixed word.
        OTA_CONFIRM_PRODUCTION: ""
        # See the preview workflow for what this does. Production binaries are
        # built with `eas build --local` and are therefore NOT registered on
        # EAS, so a production publish will usually need this set, read from the
        # artifact that actually went to the Play Store:
        #     unzip -p app-release.aab assets/fingerprint   (or the .apk)
        OTA_EXPECTED_FINGERPRINT: ""
        # This workflow publishes the bundle built from THIS commit. It does not
        # promote, copy or re-point whatever is currently on the preview branch:
        # "the thing we tested" and "the thing we ship" are the same commit, or
        # they are not the same thing at all.
        OTA_PROMOTE_FROM_PREVIEW: "never"
    cache:
      cache_paths:
        - ~/.pnpm-store
    scripts:
      - name: Authenticate (fails before anything else if the token is absent)
        script: |
          set -euo pipefail
          if [ -z "${EAS_ACCESS_TOKEN:-}" ]; then
            echo "EAS_ACCESS_TOKEN is not set. Add it to the ejazz_eas variable"
            echo "group in Codemagic, marked Secure. Nothing was published."
            exit 1
          fi
          echo "EXPO_TOKEN=$EAS_ACCESS_TOKEN" >> $CM_ENV
      - name: Authorise this production publish
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          # Deliberately the SECOND step, before pnpm, the dependency install and
          # eas-cli: an unauthorised run should fail in seconds and touch
          # nothing, not after four minutes of setup.
          #
          # Refuses a pull-request build, refuses to promote the preview branch,
          # and requires OTA_CONFIRM_PRODUCTION to equal this commit's short SHA.
          bash tools/ota/confirm-production.sh
      - name: Enable pnpm (matches project's pinned version)
        script: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install workspace dependencies
        script: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Install eas-cli
        script: |
          set -euo pipefail
          npm install -g eas-cli@27.7.2
          eas --version
      - name: Check the working tree and the OTA configuration
        script: |
          set -euo pipefail
          cd artifacts/ejazz-media-app
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree is not clean. Refusing to publish an update"
            echo "whose contents do not match a commit:"
            git status --porcelain
            exit 1
          fi
          echo "Publishing from commit: $(git rev-parse HEAD)"
          node -e '
            const c = require("./app.config.base.json");
            const e = c.expo || c;
            const eas = require("./eas.json");
            const fail = (m) => { console.error("CONFIG: " + m); process.exit(1); };
            if (!e.updates || !e.updates.url) fail("expo.updates.url is not set");
            if (!e.updates.enabled) fail("expo.updates.enabled is not true");
            if (!e.runtimeVersion || e.runtimeVersion.policy !== "fingerprint")
              fail("runtimeVersion.policy must be \"fingerprint\"");
            if (!((e.extra||{}).eas||{}).projectId) fail("extra.eas.projectId is not set");
            const want = process.env.EAS_UPDATE_BRANCH;
            const chans = Object.values(eas.build || {}).map(p => p.channel);
            if (!chans.includes(want))
              fail("no build profile in eas.json uses the channel \"" + want + "\"");
            console.log("Config OK: url=" + e.updates.url + " policy=fingerprint channel=" + want);
          '
          node -e '
            const v = require("expo-updates/package.json").version;
            console.log("expo-updates " + v);
            if (!v.startsWith("57.")) {
              console.error("expo-updates " + v + " is not on the SDK 57 line.");
              process.exit(1);
            }
          '
      - name: Check the target environment carries every required variable
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          bash tools/ota/check-env-vars.sh "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT"
      - name: Verify the runtime matches an installed build
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          bash tools/ota/check-fingerprint.sh "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT"
      - name: Publish the update and verify it landed
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          if [ -z "${EAS_UPDATE_MESSAGE:-}" ]; then
            echo "EAS_UPDATE_MESSAGE is required for a production publish."
            echo "Say what is changing and why, so update:list reads as a history"
            echo "rather than a list of commit subjects. Nothing was published."
            exit 1
          fi
          bash tools/ota/verify-publication.sh \
            "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT" "$EAS_UPDATE_MESSAGE"
      - name: Show the channel state after publishing
        script: |
          set -euo pipefail
          cd artifacts/ejazz-media-app
          eas channel:view "$EAS_UPDATE_BRANCH" --non-interactive
    publishing:
      email:
        recipients:
          - madvibes.ug@gmail.com

  # ---------------------------------------------------------------------------
  # Validation only. This workflow runs every check the preview publish runs and
  # then STOPS. There is no `eas update` anywhere in it, and no variable that
  # could turn one on.
  #
  # That is deliberate, and it is why this is a separate workflow rather than a
  # DRY_RUN flag on ejazz-ota-preview. A flag would mean the thing you run to
  # validate is the thing that publishes, with one variable standing between the
  # two: one typo, one value left over from a previous run, one default flipped,
  # and it publishes. A workflow with no publish capability cannot publish.
  # Absence of capability over configuration -- the same reasoning as the absent
  # `triggering:` blocks.
  #
  # Hard-wired to the preview branch. It asserts that below rather than merely
  # defaulting to it, because Codemagic lets any variable be overridden at start
  # time, and a validation workflow that can be pointed at production is not the
  # thing that was asked for.
  # ---------------------------------------------------------------------------

  ejazz-ota-validate:
    name: EJazz Media - OTA Validate (preview, NO PUBLISH)
    max_build_duration: 30
    environment:
      node: 20
      groups:
        - ejazz_eas
      vars:
        EAS_UPDATE_BRANCH: "preview"
        EAS_UPDATE_ENVIRONMENT: "preview"
        # As in the publishing workflows: the hash read out of the binary that
        # is actually installed, for when it was built with `eas build --local`
        # and so is not registered on EAS.
        #     unzip -p app-preview.apk assets/fingerprint
        OTA_EXPECTED_FINGERPRINT: ""
    cache:
      cache_paths:
        - ~/.pnpm-store
    scripts:
      - name: Authenticate (fails before anything else if the token is absent)
        script: |
          set -euo pipefail
          if [ -z "${EAS_ACCESS_TOKEN:-}" ]; then
            echo "EAS_ACCESS_TOKEN is not set. Add it to the ejazz_eas variable"
            echo "group in Codemagic, marked Secure."
            exit 1
          fi
          echo "EXPO_TOKEN=$EAS_ACCESS_TOKEN" >> $CM_ENV
      - name: Refuse to validate anything but preview
        script: |
          set -euo pipefail
          # Hard-wired, not defaulted. Overriding either variable at start time
          # is refused rather than honoured.
          if [ "${EAS_UPDATE_BRANCH}" != "preview" ] || [ "${EAS_UPDATE_ENVIRONMENT}" != "preview" ]; then
            echo "This workflow validates the preview channel only."
            echo "  EAS_UPDATE_BRANCH      = ${EAS_UPDATE_BRANCH}"
            echo "  EAS_UPDATE_ENVIRONMENT = ${EAS_UPDATE_ENVIRONMENT}"
            echo "Both must be 'preview'. Nothing was checked."
            exit 1
          fi
          echo "Validating preview, commit $(git rev-parse HEAD)"
      - name: Enable pnpm (matches project's pinned version)
        script: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install workspace dependencies
        script: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Install eas-cli
        script: |
          set -euo pipefail
          npm install -g eas-cli@27.7.2
          eas --version
      - name: Check the working tree and the OTA configuration
        script: |
          set -euo pipefail
          cd artifacts/ejazz-media-app
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree is not clean. A publish from here would not"
            echo "match any commit:"
            git status --porcelain
            exit 1
          fi
          echo "Validating from commit: $(git rev-parse HEAD)"
          node -e '
            const c = require("./app.config.base.json");
            const e = c.expo || c;
            const eas = require("./eas.json");
            const fail = (m) => { console.error("CONFIG: " + m); process.exit(1); };
            if (!e.updates || !e.updates.url) fail("expo.updates.url is not set");
            if (!e.updates.enabled) fail("expo.updates.enabled is not true");
            if (!e.runtimeVersion || e.runtimeVersion.policy !== "fingerprint")
              fail("runtimeVersion.policy must be \"fingerprint\"");
            if (!((e.extra||{}).eas||{}).projectId) fail("extra.eas.projectId is not set");
            const want = process.env.EAS_UPDATE_BRANCH;
            const chans = Object.values(eas.build || {}).map(p => p.channel);
            if (!chans.includes(want))
              fail("no build profile in eas.json uses the channel \"" + want + "\", so no installed app would receive an update published to it");
            console.log("Config OK: url=" + e.updates.url + " policy=fingerprint channel=" + want);
          '
          node -e '
            const v = require("expo-updates/package.json").version;
            console.log("expo-updates " + v);
            if (!v.startsWith("57.")) {
              console.error("expo-updates " + v + " is not on the SDK 57 line.");
              process.exit(1);
            }
          '
      - name: Check the target environment carries every required variable
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          bash tools/ota/check-env-vars.sh "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT"
      - name: Verify the runtime matches an installed build
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          bash tools/ota/check-fingerprint.sh "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT"
      - name: Publication readiness (reads only, publishes nothing)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:-$PWD}"
          MSG="${EAS_UPDATE_MESSAGE:-preview $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)}"
          # Token identity, channel state, current head of the branch, and -- the
          # parts no earlier step covers -- that the bundle actually compiles and
          # that the configuration reached the COMPILED BYTECODE, not merely the
          # environment. Those are two different claims: see the --clear note in
          # check-publish-readiness.sh for the cache gap that separates them.
          OTA_ASSERT_BUNDLE_CONTAINS="control.ejazzug.com stream.ejazzug.com" \
          bash tools/ota/check-publish-readiness.sh \
            "$EAS_UPDATE_BRANCH" "$EAS_UPDATE_ENVIRONMENT" "$MSG"
    publishing:
      email:
        recipients:
          - madvibes.ug@gmail.com
